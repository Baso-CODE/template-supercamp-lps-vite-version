server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    # Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;

    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # Vite hashed assets
    location /assets/ {
        try_files $uri =404;

        expires 30d;

        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # Images
    location ~* \.(png|jpg|jpeg|gif|webp|avif|svg|ico)$ {
        try_files $uri =404;

        expires 7d;
    }

    # Fonts
    location ~* \.(woff|woff2|ttf|otf)$ {
        try_files $uri =404;

        expires 30d;
    }

    # React Router fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # HTML should not be permanently cached
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires -1;
    }

    # Security
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}